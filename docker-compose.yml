# Sobe só a API para desenvolvimento local.
# O banco é o MySQL do Railway: as credenciais (MYSQLHOST, MYSQLPASSWORD...) vêm do .env,
# que não vai para o Git. Veja .env.example.
services:
  api:
    image: node:20
    container_name: dashfood-api
    working_dir: /usr/src/app
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - .env
    command: sh -c "npm install && npm run dev"
