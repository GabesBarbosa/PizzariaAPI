name: Deploy API (Node Azure Functions) to Static Web App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies (API)
        run: npm ci
        working-directory: ./api   # só se /api existir e conter package.json

      - name: Build API (if needed)
        run: npm run build
        working-directory: ./api
        continue-on-error: true

      - name: Deploy API to Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: ""        # vazio se este repo só contém a API
          api_location: "api"     # caminho para suas Azure Functions
          output_location: ""
