name: Deploy Node (Express) to Azure Web App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug - list repository
        run: |
          pwd
          ls -la
          echo "ls ./api:"
          ls -la ./api || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prisma generate (only if prisma schema exists)
        run: |
          if [ -f prisma/schema.prisma ]; then
            npx prisma generate
          else
            echo "No prisma/schema.prisma found — skipping prisma generate"
          fi

      - name: Build
        run: npm run build
        continue-on-error: false

      # Login to Azure using service principal, only if secret AZURE_CREDENTIALS exists
      - name: Login to Azure (service principal)
        if: ${{ secrets.AZURE_CREDENTIALS != '' }}
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Deploy using publish profile, if provided
      - name: Deploy to Azure Web App (publish profile)
        if: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE != '' }}
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'ComandaAPI'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: './app.zip'

      # Deploy using logged-in service principal (fallback)
      - name: Deploy to Azure Web App (service principal)
        if: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE == '' && secrets.AZURE_CREDENTIALS != '' }}
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'ComandaAPI'
          package: './app.zip'
